name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      # The dependencies are our own packages, resolved through `path`
      # repositories, so the sibling checkouts must exist in the parent of the
      # workspace before `composer install`. A path repository takes its version
      # from the `options.versions` pin in composer.json, never from a git tag,
      # so a depth-1 clone of the default branch is enough. Once the packages are
      # published to git-vcs these steps disappear and `composer install`
      # resolves them by URL.
      - name: Sibling libraries
        run: |
          git clone --depth 1 https://github.com/olegabr/eth-abi.git ../eth-abi
          git clone --depth 1 https://github.com/olegabr/eth-read.git ../eth-read
          git clone --depth 1 https://github.com/olegabr/php-keccak.git ../php-keccak

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests
        run: composer test
